<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12365a">
<title>PEEKA IMS | Manufacturing & Inventory Management</title>
<style>
:root{--navy:#12365a;--blue:#2476b9;--blue2:#eaf3fb;--ink:#182536;--muted:#687789;--line:#e2e8f0;--bg:#f4f7fb;--white:#fff;--green:#15803d;--amber:#b45309;--red:#b91c1c;--shadow:0 8px 24px rgba(18,54,90,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--navy);color:#fff;padding:22px 15px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px 18px;border-bottom:1px solid #ffffff24}.brand-icon{height:43px;width:43px;border-radius:12px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:19px}.brand h1{font-size:18px;margin:0;letter-spacing:.5px}.brand p{font-size:10px;color:#c9d8e8;margin:4px 0 0}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#9eb5cd;padding:0 10px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d7e4f2;text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:12px;align-items:center;font-size:13px}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.side-note{margin-top:auto;border:1px solid #ffffff24;border-radius:12px;padding:12px;font-size:11px;line-height:1.6;color:#c9d8e8}.side-note strong{display:block;color:white;font-size:12px;margin-bottom:4px}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:15px}.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--ink)}.top-actions{display:flex;align-items:center;gap:12px}.status{font-size:11px;background:#ecfdf3;color:#166534;border:1px solid #bbf7d0;border-radius:20px;padding:7px 10px}.avatar{height:34px;width:34px;background:var(--blue2);color:var(--navy);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px}.content{padding:28px 30px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:24px}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.page-head h2{font-size:27px;letter-spacing:-.6px;margin:7px 0}.page-head p{color:var(--muted);font-size:13px;margin:0;line-height:1.6}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:10px 13px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:7px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn:hover{filter:brightness(.97)}.btn.small{padding:7px 9px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:var(--shadow)}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{height:34px;width:34px;display:grid;place-items:center;background:var(--blue2);border-radius:10px;font-size:16px}.stat-num{font-size:29px;font-weight:800;letter-spacing:-1px;margin:14px 0 5px}.stat-foot{font-size:11px;color:var(--muted)}.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,1fr);gap:17px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:17px}.panel-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h3{margin:0;font-size:14px}.panel-head p{margin:5px 0 0;color:var(--muted);font-size:11px}.panel-body{padding:18px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px;background:#f8fafc;padding:12px 15px;white-space:nowrap}td{padding:13px 15px;border-top:1px solid #edf1f5;font-size:12px;white-space:nowrap}tbody tr:hover{background:#fbfdff}.tag{display:inline-block;border-radius:20px;padding:5px 8px;font-size:10px;font-weight:800;background:#f1f5f9;color:#475569}.tag.green{background:#dcfce7;color:#166534}.tag.amber{background:#fef3c7;color:#92400e}.tag.red{background:#fee2e2;color:#991b1b}.tag.blue{background:#dbeafe;color:#1d4ed8}.bar-row{margin:0 0 18px}.bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}.bar{height:8px;border-radius:20px;background:#edf2f7;overflow:hidden}.bar span{display:block;height:100%;border-radius:20px;background:var(--blue)}.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.quick{border:1px solid var(--line);border-radius:11px;padding:14px;background:#fff;text-align:left;color:var(--ink)}.quick:hover{border-color:#8cb9e0;background:#f8fbff}.quick .qico{font-size:19px;margin-bottom:10px}.quick strong{display:block;font-size:12px}.quick span{display:block;color:var(--muted);font-size:10px;margin-top:5px;line-height:1.4}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.search{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;font-size:12px;min-width:210px;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:#69a6dc;box-shadow:0 0 0 3px #2476b91a}.empty{padding:35px 15px;text-align:center;color:var(--muted);font-size:12px}.empty strong{display:block;color:var(--ink);margin-bottom:6px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:800;color:#475569}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:#fff;outline:none;font-size:12px}.modal-backdrop{position:fixed;inset:0;background:#0b1c2dcc;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:15px;width:min(600px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 80px #0003}.modal-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0;font-size:16px}.xbtn{border:0;background:#f1f5f9;border-radius:8px;height:30px;width:30px}.modal-body{padding:22px}.modal-foot{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.notice{border-radius:10px;padding:12px 14px;background:#eff6ff;color:#1e40af;font-size:11px;line-height:1.6;margin-bottom:18px}.mobile-menu{display:none}.footer{font-size:10px;color:#8a97a7;text-align:center;padding:12px}.hidden{display:none!important}
@media(max-width:1000px){.app{grid-template-columns:210px minmax(0,1fr)}.content{padding:22px 18px}.topbar{padding:0 18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-2{grid-template-columns:1fr}}
@media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:8;left:-270px;top:0;bottom:0;width:250px;transition:left .2s;box-shadow:0 0 0 100vmax transparent}.sidebar.open{left:0;box-shadow:0 0 0 100vmax #07152580}.topbar{height:64px;padding:0 14px}.mobile-menu{display:inline-flex}.crumb{font-size:11px}.status{display:none}.content{padding:22px 13px}.page-head{align-items:flex-start}.page-head h2{font-size:23px}.page-head .btn{font-size:0;padding:10px}.page-head .btn span{font-size:16px}.stats{gap:9px}.stat{padding:13px}.stat-num{font-size:25px}.stat-top{font-size:10px}.stat-icon{height:29px;width:29px}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.search{min-width:0;flex:1;width:100%}.toolbar{width:100%}.panel-head{padding:14px}.panel-body{padding:13px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-icon">P</div><div><h1>PEEKA IMS</h1><p>MANUFACTURING SYSTEM</p></div></div>
  <div class="nav-label">Workspace</div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span> Dashboard</button>
    <button data-page="mo"><span class="ico">▤</span> Manufacturing Orders</button>
    <button data-page="wip"><span class="ico">◫</span> WIP Tracking</button>
    <button data-page="bom"><span class="ico">☷</span> BOM List</button>
    <button data-page="inventory"><span class="ico">▣</span> Inventory</button>
    <button data-page="kitting"><span class="ico">▧</span> Kitting Material</button>
    <button data-page="barcode"><span class="ico">▥</span> Build Barcode</button>
    <button data-page="lost"><span class="ico">⚠</span> Item Lost</button>
    <button data-page="reports"><span class="ico">⇩</span> Export & Reports</button>
  </nav>
  <div class="side-note"><strong>Prototype workspace</strong>Demo data is saved safely in this browser. Use Export to download backups.</div>
</aside>
<main class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="menuBtn">☰</button><div class="crumb">PEEKA IMS <span style="color:#c1cad5"> / </span> <strong id="crumb">Dashboard</strong></div></div>
    <div class="top-actions"><span class="status">● Local demo mode</span><div class="avatar">PI</div></div>
  </header>
  <div class="content" id="content"></div>
  <div class="footer">PEEKA IMS · Manufacturing & Inventory Management System · Prototype v1.1 (Bug-Free)</div>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Add record</h3><button class="xbtn" id="closeModal">✕</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveModal">Save record</button></div></div></div>
<div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#102b47;color:white;padding:12px 18px;border-radius:10px;font-size:12px;box-shadow:0 10px 30px #0002;display:none;z-index:30"></div>
<script>
const $=s=>document.querySelector(s);
const DBKEY='peeka_ims_v1';
const initial={
 mos:[{id:'MO-26001',product:'Broncho Zero',model:'Peekaboo Project',date:'2026-10-23',person:'Production Team',status:'In Progress',qty:100},{id:'MO-26002',product:'AScope Broncho 6',model:'Peekaboo Project',date:'2026-10-24',person:'Production Team',status:'Pending',qty:50}],
 inventory:[{code:'000633025',name:'Insertion Tube',lot:'ECO3260916-2151',qty:120,min:20,location:'Store A'},{code:'000633008',name:'Control Lever',lot:'LOT-CTRL-01',qty:48,min:10,location:'Store A'},{code:'000633027',name:'Bending Cover',lot:'345771',qty:0,min:8,location:'Store B'},{code:'000633007',name:'Wire Pipe Base',lot:'LOT-WPB-02',qty:8,min:8,location:'Store A'}],
 bom:[{mo:'MO-26001',code:'000633025',lot:'ECO3260916-2151',description:'Insertion Tube',qty:10,pic:'Production Team'},{mo:'MO-26001',code:'000633008',lot:'LOT-CTRL-01',description:'Control Lever',qty:8,pic:'Production Team'}],
 wip:[{mo:'MO-26001',stage:'WIP 1',owner:'Production Team',status:'In Progress',updated:'2026-10-23'},{mo:'MO-26001',stage:'WIP 2',owner:'Production Team',status:'Pending',updated:'2026-10-23'},{mo:'MO-26002',stage:'WIP 1',owner:'Production Team',status:'Pending',updated:'2026-10-23'}],
 kitting:[],barcodes:[],lost:[]
};

let db;
try {
  const saved = localStorage.getItem(DBKEY);
  db = saved ? JSON.parse(saved) : structuredClone(initial);
  if (!db.mos || !db.inventory || !db.bom || !db.wip || !db.kitting || !db.barcodes || !db.lost) {
    db = structuredClone(initial);
  }
} catch(e) {
  db = structuredClone(initial);
}

function persist(){
  try {
    localStorage.setItem(DBKEY, JSON.stringify(db));
  } catch(e) {
    toast('Storage error: Unable to save locally.');
  }
}

let currentPage='dashboard', modalConfig=null;
const pageTitles={dashboard:'Dashboard',mo:'Manufacturing Orders',wip:'WIP Tracking',bom:'BOM List',inventory:'Inventory',kitting:'Kitting Material',barcode:'Build Barcode',lost:'Item Lost',reports:'Export & Reports'};

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tag(s){let c=s==='Complete'||s==='Available'?'green':s==='In Progress'?'blue':s==='Pending'?'amber':s==='Low Stock'||s==='Lost'?'red':'';return `<span class="tag ${c}">${esc(s)}</span>`}
function btn(label,action,cls='btn small'){return `<button class="${cls}" data-action="${action}">${label}</button>`}
function pageHead(title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">PEEKA IMS WORKSPACE</div><h2>${title}</h2><p>${sub}</p></div>${action}</div>`}
function panel(title,sub,body,action=''){return `<section class="panel"><div class="panel-head"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div>${action}</div>${body}</section>`}
function table(headers,rows,empty='No records yet. Add your first record to get started.'){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}"><div class="empty"><strong>${empty}</strong>Records you add will appear here.</div></td></tr>`}</tbody></table></div>`}
function stat(label,num,icon,foot){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-num">${num}</div><div class="stat-foot">${foot}</div></div>`}

function render(){
 $('#crumb').textContent=pageTitles[currentPage]||'Dashboard';
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));
 const pages={dashboard:renderDashboard,mo:renderMO,wip:renderWIP,bom:renderBOM,inventory:renderInventory,kitting:renderKitting,barcode:renderBarcode,lost:renderLost,reports:renderReports};
 const fn=pages[currentPage]||renderDashboard;
 $('#content').innerHTML=fn();
 $('#sidebar').classList.remove('open');
}

function renderDashboard(){
 const low=db.inventory.filter(i=>Number(i.qty)<=Number(i.min)).length, stock=db.inventory.reduce((a,i)=>a+Number(i.qty||0),0), open=db.mos.filter(m=>m.status!=='Complete').length;
 let recent=db.mos.slice(-5).reverse().map(m=>`<tr><td><strong>${esc(m.id)}</strong></td><td>${esc(m.product)}</td><td>${esc(m.model)}</td><td>${tag(m.status)}</td><td>${esc(m.date)}</td></tr>`);
 let lowRows=db.inventory.filter(i=>Number(i.qty)<=Number(i.min)).map(i=>`<tr><td><strong>${esc(i.code)}</strong></td><td>${esc(i.name)}</td><td>${esc(i.lot)}</td><td>${tag('Low Stock')}</td><td>${esc(i.qty)}</td></tr>`);
 return `${pageHead('Operations overview','Monitor production orders, inventory levels and material readiness at a glance.',btn('＋ New MO','add-mo','btn primary'))}
 <div class="stats">${stat('Total Item Types',db.inventory.length,'▣','Unique inventory records')}${stat('Stock on Hand',stock.toLocaleString(),'▤','Total quantity recorded')}${stat('Open MO',open,'▦','Not yet completed')}${stat('Low / Zero Stock',low,'⚠','At or below minimum level')}</div>
 <div class="grid-2"><div>${panel('Recent Manufacturing Orders','Latest MO activity',table(['MO Number','Product','Model / Project','Status','Production Date'],recent),btn('View all','go-mo','btn small'))}
 ${panel('Low Stock Alerts','Items requiring attention',table(['Material Code','Description','Lot Number','Alert','Qty'],lowRows,'All recorded items are above their minimum stock level.'))}</div>
 <div>${panel('Quick actions','Jump to common tasks',`<div class="panel-body"><div class="quick-grid"><button class="quick" data-action="add-mo"><div class="qico">▤</div><strong>Create MO</strong><span>Register a production order</span></button><button class="quick" data-action="add-inventory"><div class="qico">▣</div><strong>Stock In</strong><span>Add or receive material</span></button><button class="quick" data-action="stock-out"><div class="qico">⇧</div><strong>Stock Out</strong><span>Issue material to production</span></button><button class="quick" data-action="add-bom"><div class="qico">☷</div><strong>Add BOM item</strong><span>Record MO material needs</span></button><button class="quick" data-action="add-kitting"><div class="qico">▧</div><strong>Create kitting</strong><span>Prepare a material kit</span></button><button class="quick" data-action="add-lost"><div class="qico">⚠</div><strong>Report lost item</strong><span>Log a missing material</span></button></div></div>`)}
 ${panel('MO status distribution','Current order progress',`<div class="panel-body">${['Pending','In Progress','Complete'].map(s=>{let n=db.mos.filter(m=>m.status===s).length,p=db.mos.length?Math.round(n/db.mos.length*100):0;return `<div class="bar-row"><div class="bar-label"><span>${s}</span><strong>${n}</strong></div><div class="bar"><span style="width:${p}%"></span></div></div>`}).join('')}</div>`)}</div></div>`;
}

function renderMO(){let rows=db.mos.map((m,i)=>`<tr><td><strong>${esc(m.id)}</strong></td><td>${esc(m.product)}</td><td>${esc(m.model)}</td><td>${esc(m.date)}</td><td>${esc(m.person)}</td><td>${tag(m.status)}</td><td>${esc(m.qty)}</td><td>${btn('Edit',`edit-mo-${i}`)} ${btn('Delete',`del-mo-${i}`)}</td></tr>`);
return `${pageHead('Manufacturing Orders','Create and monitor production orders, ownership and completion status.',btn('＋ Add MO','add-mo','btn primary'))}${panel('MO register',`${db.mos.length} order(s) registered`,table(['MO Number','Product Name','Model / Project','Production Date','Assigned Person','Status','Build Qty','Actions'],rows))}`}

function renderWIP(){let rows=db.wip.map((w,i)=>`<tr><td><strong>${esc(w.mo)}</strong></td><td>${esc(w.stage)}</td><td>${esc(w.owner)}</td><td>${tag(w.status)}</td><td>${esc(w.updated)}</td><td>${btn('Edit',`edit-wip-${i}`)} ${btn('Delete',`del-wip-${i}`)}</td></tr>`);
return `${pageHead('WIP Tracking','Track work-in-progress stages for each manufacturing order.',btn('＋ Add WIP stage','add-wip','btn primary'))}${panel('Work in progress','Example stages: WIP 1 through WIP 6',table(['MO Number','WIP Stage','Owner / PIC','Status','Last Updated','Actions'],rows))}`}

function renderBOM(){let rows=db.bom.map((b,i)=>`<tr><td>${esc(b.mo)}</td><td><strong>${esc(b.code)}</strong></td><td>${esc(b.lot)}</td><td>${esc(b.description)}</td><td>${esc(b.qty)}</td><td>${esc(b.pic)}</td><td>${btn('Edit',`edit-bom-${i}`)} ${btn('Delete',`del-bom-${i}`)}</td></tr>`);
return `${pageHead('Bill of Materials (BOM)','Record the materials, lot numbers and quantities required for each MO.',btn('＋ Add BOM item','add-bom','btn primary'))}${panel('BOM list','Material requirements by manufacturing order',table(['MO Number','Material Code','Lot Number','Material Description','Qty Required','PIC','Actions'],rows))}`}

function renderInventory(){let rows=db.inventory.map((i,n)=>`<tr><td><strong>${esc(i.code)}</strong></td><td>${esc(i.name)}</td><td>${esc(i.lot)}</td><td>${esc(i.location)}</td><td>${Number(i.qty)<=Number(i.min)?tag('Low Stock'):tag('Available')}</td><td><strong>${esc(i.qty)}</strong></td><td>${esc(i.min)}</td><td>${btn('Stock In',`stockin-${n}`)} ${btn('Stock Out',`stockout-${n}`)} ${btn('Edit',`edit-inventory-${n}`)} ${btn('Delete',`del-inventory-${n}`)}</td></tr>`);
return `${pageHead('Inventory Management','Monitor material codes, lot traceability, stock balances and minimum stock levels.',btn('＋ Add material','add-inventory','btn primary'))}<div class="notice">Demo note: stock changes are stored in this browser safely.</div>${panel('Inventory register',`${db.inventory.length} material record(s)`,table(['Material Code','Description','Lot Number','Location','Status','On Hand','Min. Stock','Actions'],rows))}`}

function renderKitting(){let rows=db.kitting.map((k,i)=>`<tr><td><strong>${esc(k.id)}</strong></td><td>${esc(k.mo)}</td><td>${esc(k.materials)}</td><td>${esc(k.qty)}</td><td>${tag(k.status)}</td><td>${esc(k.pic)}</td><td>${btn('Edit',`edit-kitting-${i}`)} ${btn('Delete',`del-kitting-${i}`)}</td></tr>`);
return `${pageHead('Kitting Material','Prepare and track material kits required for a manufacturing order.',btn('＋ Create kit','add-kitting','btn primary'))}${panel('Kitting register','Confirm material readiness before issuing items to production',table(['Kit ID','MO Number','Material / Kit Description','Qty / Kits','Status','PIC','Actions'],rows))}`}

function renderBarcode(){let rows=db.barcodes.map((b,i)=>`<tr><td><strong>${esc(b.code)}</strong></td><td>${esc(b.mo)}</td><td>${esc(b.product)}</td><td>${esc(b.build)}</td><td>${esc(b.date)}</td><td>${btn('Delete',`del-barcode-${i}`)}</td></tr>`);
return `${pageHead('Build Barcode','Create traceability records linking a build, product and MO.',btn('＋ Create barcode record','add-barcode','btn primary'))}<div class="notice">This prototype records barcode text.</div>${panel('Barcode register','One record per build / tracking code',table(['Barcode / QR Text','MO Number','Product','Build Reference','Created Date','Actions'],rows))}`}

function renderLost(){let rows=db.lost.map((l,i)=>`<tr><td>${esc(l.date)}</td><td><strong>${esc(l.code)}</strong></td><td>${esc(l.name)}</td><td>${esc(l.lot)}</td><td>${esc(l.qty)}</td><td>${esc(l.reporter)}</td><td>${tag(l.status)}</td><td>${btn('Edit',`edit-lost-${i}`)} ${btn('Delete',`del-lost-${i}`)}</td></tr>`);
return `${pageHead('Item Lost','Log and investigate missing materials or inventory discrepancies.',btn('＋ Report item lost','add-lost','btn primary'))}${panel('Lost item register','Record the material identity, quantity and investigation status',table(['Date','Material Code','Description','Lot Number','Qty Lost','Reported By','Status','Actions'],rows))}`}

function renderReports(){return `${pageHead('Export & Reports','Download module data as CSV files that can be opened in Excel.')}<div class="notice">Exports contain the records currently saved in this browser.</div><div class="grid-2">${[['mos','Manufacturing Orders','MO number, product, project, date and status'],['wip','WIP Tracking','Stages, owners and progress'],['bom','BOM List','Material requirements and lot numbers'],['inventory','Inventory','Current stock balances and minimum levels'],['kitting','Kitting Material','Kit readiness and MO link'],['barcodes','Build Barcode','Build traceability records'],['lost','Item Lost','Lost material reports']].map(x=>panel(x[1],x[2],`<div class="panel-body"><button class="btn primary" data-action="export-${x[0]}">⇩ Export ${x[1]} CSV</button></div>`)).join('')}</div><div class="panel"><div class="panel-head"><h3>Backup all data</h3></div><div class="panel-body"><p style="font-size:12px;color:var(--muted);margin-top:0">Download all module data as one JSON backup file.</p><button class="btn primary" data-action="backup">⇩ Download full backup</button> <button class="btn" data-action="reset-demo">Reset demo data</button></div></div>`}

const forms={
 mo:{title:'Manufacturing Order',key:'mos',fields:[['id','MO Number','text',1],['product','Product Name','text',1],['model','Model / Project','text',1],['date','Production Date','date',1],['person','Assigned Person / PIC','text',1],['status','MO Status','select',['Pending','In Progress','Complete']],['qty','Build Quantity','number',1]]},
 wip:{title:'WIP Stage',key:'wip',fields:[['mo','MO Number','select-mo',1],['stage','WIP Stage','select',['WIP 1','WIP 2','WIP 3','WIP 4','WIP 5','WIP 6']],['owner','Owner / PIC','text',1],['status','Status','select',['Pending','In Progress','Complete']],['updated','Last Updated','date',1]]},
 bom:{title:'BOM Material',key:'bom',fields:[['mo','MO Number','select-mo',1],['code','Material Code','text',1],['lot','Lot Number','text',1],['description','Material Description','text',1],['qty','Quantity Required','number',1],['pic','PIC','text',1]]},
 inventory:{title:'Inventory Material',key:'inventory',fields:[['code','Material Code','text',1],['name','Material Description','text',1],['lot','Lot Number','text',1],['qty','Opening / Current Quantity','number',1],['min','Minimum Stock Level','number',1],['location','Storage Location','text',1]]},
 kitting:{title:'Kitting Record',key:'kitting',fields:[['id','Kit ID','text',1],['mo','MO Number','select-mo',1],['materials','Material / Kit Description','text',1],['qty','Quantity / Number of Kits','number',1],['status','Status','select',['Pending','In Progress','Complete']],['pic','PIC','text',1]]},
 barcode:{title:'Build Barcode Record',key:'barcodes',fields:[['code','Barcode / QR Text','text',1],['mo','MO Number','select-mo',1],['product','Product Name','text',1],['build','Build Reference','text',1],['date','Created Date','date',1]]},
 lost:{title:'Lost Item Report',key:'lost',fields:[['date','Report Date','date',1],['code','Material Code','text',1],['name','Material Description','text',1],['lot','Lot Number','text',1],['qty','Quantity Lost','number',1],['reporter','Reported By','text',1],['status','Investigation Status','select',['Pending','In Progress','Complete']]]}
};

function openForm(type,index=null,extra={}){
 const f=forms[type];if(!f)return;
 const editing=index!==null, old=editing?db[f.key][index]:{};
 modalConfig={type,index,extra};
 $('#modalTitle').textContent=(editing?'Edit ':'Add ')+f.title;
 $('#modalBody').innerHTML=`<form id="recordForm" class="form-grid">${f.fields.map(([key,label,kind,opts])=>{
 let value=old[key]??(extra[key]??(kind==='date'?new Date().toISOString().slice(0,10):kind==='select'?(opts[0]||''):kind==='select-mo'?(db.mos[0]?.id||''):''));
 let el=kind==='select'||kind==='select-mo'?`<select name="${key}" ${opts===1?'required':''}>${(kind==='select-mo'?db.mos.map(m=>m.id):opts).map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select>`:`<input name="${key}" type="${kind}" value="${esc(value)}" ${opts===1?'required':''} ${key==='qty'||key==='min'?'min="0"':''}>`;
 return `<div class="field"><label>${label}</label>${el}</div>`;
 }).join('')}</form>`;
 $('#modalBackdrop').classList.add('show');
}

function closeForm(){$('#modalBackdrop').classList.remove('show');modalConfig=null}

function saveForm(){
  if(!modalConfig)return;
  const form=$('#recordForm');
  if(!form.reportValidity())return;
  const data=Object.fromEntries(new FormData(form).entries());
  for(const k of ['qty','min'])if(data[k]!==undefined){
    data[k]=Number(data[k]);
    if(data[k]<0){toast('Quantity and minimum levels cannot be negative.');return;}
  }
  const {type,index}=modalConfig,key=forms[type].key;
  
  if(type==='mo'&&index===null&&db.mos.some(m=>m.id===data.id)){toast('MO Number already exists.');return}
  if(type==='inventory'&&index===null&&db.inventory.some(m=>m.code===data.code&&m.lot===data.lot)){toast('Material code and lot already exist.');return}
  
  if(index===null){
    if(type==='kitting'&&!data.id)data.id='KIT-'+Date.now().toString().slice(-6);
    db[key].push(data);
  } else {
    db[key][index]={...db[key][index],...data};
  }
  if(type==='wip')data.updated=new Date().toISOString().slice(0,10);
  persist();closeForm();render();toast('Record saved successfully.');
}

function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>t.style.display='none',2600)}
function download(name,content,type='text/csv;charset=utf-8;'){const blob=new Blob(['\ufeff'+content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function csvValue(v){let s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}
function exportKey(key){const rows=db[key]||[];if(!rows.length){toast('No records to export yet.');return}const headers=[...new Set(rows.flatMap(Object.keys))];download(`peeka_ims_${key}_${new Date().toISOString().slice(0,10)}.csv`,[headers.map(csvValue).join(','),...rows.map(r=>headers.map(h=>csvValue(r[h])).join(','))].join('\r\n'))}
function deleteRow(type,index){const key=forms[type].key;if(!confirm('Delete this record? This action cannot be undone.'))return;db[key].splice(index,1);persist();render();toast('Record deleted.')}

function changeStock(index,dir){
  const item=db.inventory[index];
  modalConfig={stockIndex:index,dir};
  $('#modalTitle').textContent=dir==='in'?'Stock In':'Stock Out';
  $('#modalBody').innerHTML=`<div class="notice">${esc(item.code)} · ${esc(item.name)} · Current stock: <strong>${item.qty}</strong></div><div class="form-grid"><div class="field"><label>Quantity</label><input id="stockQty" type="number" min="1" value="1" required></div><div class="field"><label>Reference / MO (optional)</label><input id="stockRef" placeholder="e.g. MO-26001"></div></div>`;
  $('#modalBackdrop').classList.add('show');
}

function saveStock(){
  if(!modalConfig||modalConfig.stockIndex===undefined)return false;
  const qtyInput=$('#stockQty');
  if(!qtyInput)return false;
  const qty=Number(qtyInput.value);
  if(!Number.isFinite(qty)||qty<=0){toast('Enter a quantity greater than zero.');return true}
  const item=db.inventory[modalConfig.stockIndex];
  if(modalConfig.dir==='out'&&qty>item.qty){toast('Stock Out exceeds available stock.');return true}
  item.qty+=modalConfig.dir==='in'?qty:-qty;
  persist();closeForm();render();toast(`Stock ${modalConfig.dir==='in'?'In':'Out'} recorded.`);return true;
}

document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-page]');if(nav){currentPage=nav.dataset.page;render();return}
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='go-mo'){currentPage='mo';render();return}
 if(a==='add-mo')return openForm('mo');if(a==='add-wip')return openForm('wip');if(a==='add-bom')return openForm('bom');if(a==='add-inventory')return openForm('inventory');if(a==='add-kitting')return openForm('kitting');if(a==='add-barcode')return openForm('barcode');if(a==='add-lost')return openForm('lost');
 if(a==='stock-out')return currentPage='inventory',render();
 if(a==='backup'){download('peeka_ims_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json');return}
 if(a==='reset-demo'){if(confirm('Reset all records to the original demo data? Current browser data will be replaced.')){db=structuredClone(initial);persist();render();toast('Demo data reset.')}return}
 if(a.startsWith('export-'))return exportKey(a.slice(7));
 let m=a.match(/^(edit|del)-(mo|wip|bom|inventory|kitting|barcode|lost)-(\d+)$/);if(m){const [,op,type,idx]=m;return op==='edit'?openForm(type,Number(idx)):deleteRow(type,Number(idx))}
 m=a.match(/^stock(in|out)-(\d+)$/);if(m)return changeStock(Number(m[2]),m[1]);
});

$('#saveModal').addEventListener('click',()=>{if(!saveStock())saveForm()});
$('#closeModal').addEventListener('click',closeForm);
$('#cancelModal').addEventListener('click',closeForm);
$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));

render();
</script>
</body>
</html>
